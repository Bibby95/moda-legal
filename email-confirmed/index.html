<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <meta name="robots" content="noindex" />
  <title>MODA — Email Confirmed</title>
  <link rel="icon" href="/moda-legal/assets/favicon/favicon.ico" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    .confirm-btn { display:inline-block; background:var(--ink); color:var(--canvas); text-decoration:none;
      font-size:15px; font-weight:600; padding:13px 22px; border-radius:10px; margin-top:8px; }
    .confirm-btn:hover { background:var(--accent); }
  </style>
</head>
<body>
<div class="wrap"><a class="home" href="../">← MODA</a>
<h1 id="confirm-title">Email updated</h1>
<p id="confirm-body">Your MODA account email address has been changed. You can close this page and return to the app.</p>
<p><a class="confirm-btn" href="moda://auth/callback">Open Moda</a></p>
<footer>MODA is made by Lorenzo Ventures LLC.</footer></div>
<script>
(function () {
  var hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
  var query = new URLSearchParams(window.location.search);
  var error = hash.get("error") || query.get("error");
  var errorDescription = hash.get("error_description") || query.get("error_description");
  var message = hash.get("message") || query.get("message");

  var titleEl = document.getElementById("confirm-title");
  var bodyEl = document.getElementById("confirm-body");

  if (error) {
    titleEl.textContent = "Something went wrong";
    bodyEl.textContent = errorDescription
      || "This confirmation link is invalid or has expired. Request a new email change from inside the app.";
  } else if (message) {
    titleEl.textContent = "Almost done";
    bodyEl.textContent = message
      || "Check your other inbox for the second confirmation link — both addresses need to confirm the change.";
  }
  // No params at all: the default "Email updated" success copy above stands.
})();
</script>
</body>
</html>
